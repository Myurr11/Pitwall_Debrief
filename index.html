  const fm=ms=>ms==null?'–':new Date(ms).toISOString().slice(11,19);
  const rows=M.rc.filter(r=>(S.rcCat==='all'||r.cat===S.rcCat)&&(!S.rcText||(r.msg+' '+r.flag).toLowerCase().includes(S.rcText.toLowerCase())))
    .map(r=>`<tr><td class="num">${fm(r.date)}</td><td class="num">${r.lap==null?'–':r.lap}</td><td>${esc(r.cat)}</td><td>${r.flag?`<span class="flag ${esc(r.flag.toLowerCase().replace(/\W+/g,''))}">${esc(r.flag)}</span>`:''}</td><td style="white-space:normal">${esc(r.msg)}</td></tr>`).join('');
  const log=`<div class="ctrls"><div class="ctl-g"><div class="lbl">Category</div>${segHTML('rcCat',cats.map(c=>[c,c==='all'?'All':c]),S.rcCat)}</div><div class="ctl-g"><div class="lbl">Search</div><input id="rcq" class="sel" type="search" placeholder="car number, turn, penalty" value="${esc(S.rcText)}"></div></div>
  <div class="tbl"><table><thead><tr><th class="num">Time (UTC)</th><th class="num">Lap</th><th>Category</th><th>Flag</th><th>Message</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="dim">No messages match.</td></tr>'}</tbody></table></div>`;
  return{html:`<div class="stack">${has?panel('w-t','Air and track temperature','Degrees Celsius, minutes from the start of lap 1',{h:420})+panel('w-h','Humidity','Percent',{h:300})+panel('w-w','Wind','Metres per second. The tooltip also gives the direction.',{h:300})+panel('w-p','Air pressure','Millibar',{h:300})+panel('w-r','Rainfall','Rain recorded by the track sensor',{h:240}):empty('No weather data in this file.')}
    <section class="panel"><div class="ph"><h3>Race control log</h3><span class="note">${M.rc.length} messages</span></div>${log}</section></div>`,
  mount(){
    const inp=$('#rcq');if(inp)inp.addEventListener('input',e=>{S.rcText=e.target.value;const p=e.target.selectionStart;rerender();const n=$('#rcq');if(n){n.focus();n.setSelectionRange(p,p);}});
    if(!has)return;
    const mn=ms=>(ms-M.t0)/60000,x0=Math.floor(mn(w[0].ms)),x1=Math.ceil(mn(w[w.length-1].ms));
    const bands=M.windows.filter(k=>k.t0&&k.t1).map(k=>({x0:mn(k.t0),x1:mn(k.t1),label:k.kind}));
    const base={x:[x0,x1],xFmt:v=>v+' min',xTitle:'Minutes from the start of lap 1',bands,vlines:[{x:0,label:'Start'}],top:24,m:{l:64},tipTitle:x=>Math.round(x)+' min'};
    const ser=(k,l,c)=>({id:k,label:l,color:c,w:2.2,pts:w.filter(r=>r[k]!=null).map(r=>[Math.round(mn(r.ms)),r[k]])});
    const dom=(k,pad)=>{const v=w.map(r=>r[k]).filter(x=>x!=null);return v.length?[Math.floor(Math.min(...v)-pad),Math.ceil(Math.max(...v)+pad)]:[0,1];};
    const tv=w.flatMap(r=>[r.air,r.track]).filter(x=>x!=null);
    lines($('#w-t'),{...base,aria:'Temperatures',h:420,y:[Math.floor(Math.min(...tv)-1),Math.ceil(Math.max(...tv)+1)],yFmt:v=>v+'°',series:[ser('track','Track','var(--q1)'),ser('air','Air','var(--q3)')],tipFmt:v=>f1(v)+'°C',snap:1});
    lines($('#w-h'),{...base,aria:'Humidity',h:300,y:dom('hum',2),yFmt:v=>v+'%',series:[ser('hum','Humidity','var(--q2)')],tipFmt:v=>f1(v)+'%',snap:1});
    const wm=new Map(w.map(r=>[Math.round(mn(r.ms)),r]));
    lines($('#w-w'),{...base,aria:'Wind',h:300,y:[0,Math.max(4,Math.ceil(Math.max(...w.map(r=>r.wind||0))+1))],yFmt:v=>v,series:[ser('wind','Wind speed','var(--q1)')],snap:1,
      tip:xv=>{const r=wm.get(xv);return r?tipRows(Math.round(xv)+' min',[['Speed',f1(r.wind)+' m/s'],['Direction',Math.round(r.dir)+'°']]):null;}});
    lines($('#w-p'),{...base,aria:'Pressure',h:300,y:dom('press',1),yFmt:v=>v,series:[ser('press','Pressure','var(--q3)')],tipFmt:v=>f1(v)+' mbar',snap:1});
    const rain=w.some(r=>r.rain>0);
    lines($('#w-r'),{...base,aria:'Rainfall',h:240,y:[-.1,1.1],yTicks:[0,1],yFmt:v=>v?'rain':'dry',series:[ser('rain','Rain','var(--q1)')],tipFmt:v=>v?'rain':'dry',snap:1});

  }};
}

/* ================= live data from OpenF1 (through the local server) ================= */
let RID=0,LOADTOK=0;
const LS={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};

async function api(ep,toks,fresh){
  const q=[...(toks||[]),...(fresh?['nocache=1']:[])].join('&');
  let r;try{r=await fetch('/api/'+ep+(q?'?'+q:''));}catch(e){throw new Error('Cannot reach the local server. Is pitwall.py still running?');}

}
const kindOf=s=>{const n=(s.session_name||'').toLowerCase(),t=(s.session_type||'').toLowerCase();
  if(/qualifying|shootout/.test(n))return'quali';if(/sprint/.test(n))return'sprint';if(/race/.test(n))return'race';if(/practice/.test(n))return'practice';
  return t==='race'?'race':t==='qualifying'?'quali':'practice';};
const NAV=[['overview','Overview',pgOverview,'Who finished where, and what decided it',()=>true],

  ['laptimes','Lap times',pgLaps,'Who was quick, and how steady',()=>true],
  ['tyres','Tyres',pgTyres,'Stints and how each compound wore',()=>true],
  ['pits','Pit stops',pgPits,'Stop times, timing and what they cost',()=>true],
  ['sectors','Sectors & speed',pgSectors,'Where the lap time came from',()=>true],
  ['telemetry','Telemetry',pgTelemetry,'Any two laps compared, metre by metre',()=>true],

const CUR={meetings:[],sessions:[],session:null};
const setStatus=(t,err)=>{const e=$('#loadst');e.textContent=t||'';e.className=err?'err':'';e.hidden=!t;};

/* ---- pickers ---- */
function opt(v,t,sel,dis){return`<option value="${esc(v)}" ${sel?'selected':''} ${dis?'disabled':''}>${esc(t)}</option>`;}
const dstr=s=>s?new Date(pd(s)).toISOString().slice(0,10):'';
async function loadMeetings(year,pickKey){
  setStatus('Loading race weekends…');
  const ms=await api('meetings',[eq('year',year)]);ms.sort((a,b)=>pd(a.date_start)-pd(b.date_start));CUR.meetings=ms;
  const now=Date.now();let sel=pickKey&&ms.find(m=>String(m.meeting_key)===String(pickKey));

  $('#selMeet').innerHTML=ms.map(m=>opt(m.meeting_key,`${m.meeting_name||m.meeting_official_name} · ${m.country_name||m.location||''} · ${dstr(m.date_start)}`,sel&&m.meeting_key===sel.meeting_key,pd(m.date_start)>now)).join('')||opt('','No weekends found',true,true);
  setStatus('');

}
async function loadSessions(meeting,pickKey){

  const now=Date.now(),done=s=>s.date_end&&pd(s.date_end)<now;
  let sel=pickKey&&ss.find(s=>String(s.session_key)===String(pickKey));
  if(!sel){sel=ss.find(s=>/^race$/i.test(s.session_name)&&done(s))||[...ss].reverse().find(done)||ss[0];}
  $('#selSess').innerHTML=ss.map(s=>opt(s.session_key,`${s.session_name} · ${dstr(s.date_start)}${done(s)?'':' (not finished)'}`,sel&&s.session_key===sel.session_key,!done(s))).join('')||opt('','No sessions',true,true);
  setStatus('');

}
async function chooseYear(y,pm,ps){
  try{const m=await loadMeetings(y,pm);if(!m){return;}const s=await loadSessions(m,ps);if(s)await loadSession(s);}catch(e){setStatus(e.message,true);showError(e.message);}
}
const showError=msg=>{if(!S.M)$('#main').innerHTML=`<header class="ph1"><h1>Could not load</h1></header>${empty(esc(msg))}`;};

/* ---- session loading ---- */
async function loadSession(sess,fresh){
  const tok=++LOADTOK,sk=sess.session_key,kind=kindOf(sess),raceLike=kind==='race'||kind==='sprint';
  const meeting=CUR.meetings.find(m=>m.meeting_key===sess.meeting_key)||{};
  const steps=[['drivers',1],['laps',1],['stints'],['pit'],['session_result'],(raceLike||kind==='quali')?['starting_grid']:null,['race_control'],['weather'],raceLike?['position']:null].filter(Boolean);
  const got={},info=[];
  LS.set('pw.session',sk);LS.set('pw.meeting',sess.meeting_key);
  for(let i=0;i<steps.length;i++){
    const [ep,fatal]=steps[i];setStatus(`Loading ${ep.replace('_',' ')} (${i+1} of ${steps.length})…`);
    const t0=performance.now();
    try{got[ep]=await api(ep,[eq('session_key',sk)],fresh);info.push([ep,got[ep].length,Math.round(performance.now()-t0),got[ep].length?'':'no rows']);}
    catch(e){if(fatal){setStatus(e.message,true);showError(e.message);return;}got[ep]=[];info.push([ep,0,Math.round(performance.now()-t0),e.message]);}
    if(tok!==LOADTOK)return;
  }
  if(!got.drivers.length||!got.laps.length){const m=`OpenF1 returned no ${got.drivers.length?'laps':'drivers'} for this session.`;setStatus(m,true);showError(m);return;}
  const seen=new Set(),drivers=[];
  got.drivers.forEach(d=>{if(seen.has(d.driver_number))return;seen.add(d.driver_number);
    drivers.push({n:d.driver_number,code:d.name_acronym||String(d.driver_number),name:d.full_name||d.broadcast_name||String(d.driver_number),team:d.team_name||'',color:'#'+(d.team_colour||'888888').replace('#','')});});
  const grid={};got.starting_grid&&got.starting_grid.forEach(g=>{grid[g.driver_number]=g.position;});
  const laps={};let total=0;
  got.laps.forEach(l=>{(laps[l.driver_number]=laps[l.driver_number]||[]).push([l.lap_number,l.date_start,l.lap_duration,l.duration_sector_1,l.duration_sector_2,l.duration_sector_3,l.i1_speed,l.i2_speed,l.st_speed,!!l.is_pit_out_lap]);total=Math.max(total,l.lap_number);});
  Object.values(laps).forEach(a=>a.sort((x,y)=>x[0]-y[0]));
  const raw={meta:{sample:false,source:'OpenF1',session_key:sk,meeting:meeting.meeting_name||meeting.meeting_official_name||sess.location,circuit:sess.circuit_short_name,country:sess.country_name,year:sess.year,
      session_name:sess.session_name,session_type:sess.session_type,kind,date_start:sess.date_start,date_end:sess.date_end,total_laps:total,fetched:new Date().toLocaleString()},
    drivers,laps,tel:{},
    results:(got.session_result||[]).map(r=>({n:r.driver_number,pos:r.position,grid:grid[r.driver_number]==null?null:grid[r.driver_number],laps:r.number_of_laps,dur:r.duration,gap:r.gap_to_leader,dnf:!!r.dnf,dns:!!r.dns,dsq:!!r.dsq})),
    stints:(got.stints||[]).map(x=>[x.driver_number,x.stint_number,x.compound,x.lap_start,x.lap_end,x.tyre_age_at_start||0]),
    pits:(got.pit||[]).map(x=>[x.driver_number,x.lap_number,x.date,x.lane_duration!=null?x.lane_duration:x.pit_duration,x.stop_duration==null?null:x.stop_duration]),
    positions:(got.position||[]).map(x=>[x.driver_number,x.date,x.position]),
    rc:(got.race_control||[]).map(x=>[x.date,x.lap_number,x.category,x.flag,x.scope,x.sector,x.driver_number,x.message]),
    weather:(got.weather||[]).map(x=>[x.date,x.air_temperature,x.track_temperature,x.humidity,x.pressure,x.rainfall,x.wind_speed,x.wind_direction])};
  setStatus('');

}
const reloadSession=()=>{if(CUR.session)loadSession(CUR.session,true);};
function loadRaw(raw,name,info){
  if(!raw||!raw.drivers||!raw.laps)throw new Error('missing drivers or laps');
  S.M=prepare(raw);S.M.loadInfo=info||[['file',Object.keys(raw.laps).length,null,name||'']];
  S.sel=new Set(S.M.drivers.slice(0,5).map(d=>d.n));S.drv=S.M.drivers[0].n;S.tA=S.tB=S.comp=null;S.a=S.b=null;

/* ---- telemetry for one lap ---- */
async function loadTel(M,n,lapNo){
  const key=n+':'+lapNo;if(M.telCache[key])return M.telCache[key];
  M._telP=M._telP||{};if(M._telP[key])return M._telP[key];
  const d=M.byN.get(n),l=d&&d.lapBy.get(lapNo);
  if(!l||l.start==null||l.dur==null)throw new Error('This lap has no start time or lap time, so there is no telemetry window.');
  const iso=ms=>new Date(ms).toISOString().replace('Z','+00:00');
  const toks=[eq('session_key',M.meta.session_key),eq('driver_number',n),ge('date',iso(l.start)),le('date',iso(l.start+l.dur*1000+400))];
  const p=(async()=>{
    const car=await api('car_data',toks);
    if(car.length<30)throw new Error(`OpenF1 has no car data for ${d.code} on lap ${lapNo} in this session (${car.length} samples).`);
    let loc=[];try{loc=await api('location',toks);}catch(e){}
    car.sort((a,b)=>pd(a.date)-pd(b.date));loc.sort((a,b)=>pd(a.date)-pd(b.date));
    const lt=loc.map(r=>pd(r.date)),at=(ts,k)=>{if(!lt.length)return null;if(ts<=lt[0])return loc[0][k];if(ts>=lt[lt.length-1])return loc[loc.length-1][k];
      let lo=0,hi=lt.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(lt[m]<=ts)lo=m;else hi=m;}const w=lt[hi]!==lt[lo]?(ts-lt[lo])/(lt[hi]-lt[lo]):0;return loc[lo][k]+w*(loc[hi][k]-loc[lo][k]);};
    const o={lap:lapNo,dur:l.dur,t:[],speed:[],thr:[],brk:[],gear:[],rpm:[],drs:[],x:[],y:[]};
    car.forEach(r=>{const ts=pd(r.date),t=(ts-l.start)/1000;if(t<-0.3||t>l.dur+0.4)return;
      o.t.push(Math.round(t*1000)/1000);o.speed.push(r.speed);o.thr.push(r.throttle);o.brk.push(r.brake);o.gear.push(r.n_gear);o.rpm.push(r.rpm);o.drs.push(r.drs);
      const x=at(ts,'x'),y=at(ts,'y');o.x.push(x==null?null:Math.round(x));o.y.push(y==null?null:Math.round(y));});
    if(o.t.length<30)throw new Error('The car data for this lap does not line up with the lap times.');
    M.telCache[key]=o;return o;
  })();
  M._telP[key]=p;p.catch(()=>{delete M._telP[key];});return p;
}
function exportRaw(M){
  const out={...M.raw,tel:{}};[S.tA,S.tB].forEach(t=>{if(t&&M.telCache[t.n+':'+t.lap]&&!out.tel[t.n])out.tel[t.n]=M.telCache[t.n+':'+t.lap];});
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`${M.meta.year}-${(M.meta.meeting||'race').replace(/\W+/g,'-')}-${(M.meta.session_name||'').replace(/\W+/g,'-')}.json`.toLowerCase();
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---- router ---- */
function render(){
  ROS.forEach(r=>r.disconnect());ROS=[];hideTip();RID++;
  const M=S.M;
  const vis=NAV.filter(n=>!M||n[4](M));
  $('#nav').innerHTML=vis.map(n=>`<a href="#${n[0]}" data-id="${n[0]}">${n[1]}</a>`).join('');
  const id=(location.hash||'#overview').slice(1),pg=vis.find(n=>n[0]===id)||vis[0];
  $$('#nav a').forEach(a=>{const on=a.dataset.id===pg[0];a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');});
  if(!M){$('#sess').innerHTML='<b>No session loaded</b>';$('#main').innerHTML=`<header class="ph1"><h1>Pit Wall Debrief</h1><p class="lead">Choose a season, race weekend and session on the left. Practice, qualifying, sprint and race sessions all work.</p></header>${$('#loadst').textContent?'':empty('Loading the calendar from OpenF1…')}`;return;}
  const m=M.meta;
  $('#sess').innerHTML=`<b>${esc(m.meeting||'')}</b><span>${esc(m.session_name||'')} · ${esc(m.circuit||'')} · ${esc(m.year||'')}</span>`;
  $('#sumtxt').textContent=`${m.meeting||''} · ${m.session_name||''}`;
  let out;try{out=pg[2](M);}catch(e){console.error(e);$('#main').innerHTML=`<header class="ph1"><h1>${pg[1]}</h1></header>`+empty('This page could not be drawn: '+esc(e.message));return;}
  $('#main').innerHTML=`<header class="ph1"><h1>${pg[1]}</h1><p class="lead">${pg[3]}</p></header>${out.html}`;
  try{out.mount();}catch(e){console.error(e);}
  $$('[data-seg]').forEach(g=>$$('button',g).forEach(b=>b.addEventListener('click',()=>{S[g.dataset.seg]=b.dataset.v;rerender();})));
}
function rerender(){const y=scrollY;render();scrollTo(0,y);}
async function init(){
  addEventListener('hashchange',()=>{render();scrollTo(0,0);});
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',rerender);}catch(e){}
  new MutationObserver(()=>rerender()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  const cy=new Date().getFullYear(),ys=[];for(let y=cy;y>=2023;y--)ys.push(y);
  const savedMeet=LS.get('pw.meeting'),savedSess=LS.get('pw.session');
  $('#selYear').innerHTML=ys.map(y=>opt(y,y,false)).join('');
  $('#selYear').addEventListener('change',e=>{S.M=null;chooseYear(+e.target.value);});
  $('#selMeet').addEventListener('change',async e=>{const m=CUR.meetings.find(x=>String(x.meeting_key)===e.target.value);if(!m)return;try{const s=await loadSessions(m);if(s)await loadSession(s);}catch(er){setStatus(er.message,true);}});
  $('#selSess').addEventListener('change',async e=>{const s=CUR.sessions.find(x=>String(x.session_key)===e.target.value);if(s)try{await loadSession(s);}catch(er){setStatus(er.message,true);}});
  $('#selFocus').addEventListener('change',e=>{S.drv=+e.target.value;const d=S.M.byN.get(S.drv);S.tA={n:d.n,lap:fastestLapNo(d)};S.tB=null;rerender();});
  if(matchMedia('(min-width:901px)').matches)$('#pick').open=true;
  render();
  // choose the year of the saved meeting if known, else the current year, falling back one year when the season has no finished weekend yet
  let y=+LS.get('pw.year')||cy;
  const pick=y2=>{$('#selYear').value=String(y2);LS.set('pw.year',y2);return chooseYear(y2,savedMeet,savedSess);};
  $('#selYear').addEventListener('change',e=>LS.set('pw.year',e.target.value));
  try{await pick(y);}catch(e){setStatus(e.message,true);}
}

init();
</script>
